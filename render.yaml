# Blueprint do Render: cria o Web Service do CRM com um clique
# (Render > New > Blueprint > selecionar este repositório).
services:
  - type: web
    name: crm-polos-ead
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: API_TOKEN
        generateValue: true
      - key: AUTO_SEED
        value: "1"
